apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: minecraft
spec:
  # nfs-csi rather than the default local-path: the workload runs on
  # Karpenter nodes, which are ephemeral, and NFS storage survives the pod
  # landing on a different node after a node replacement.
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
