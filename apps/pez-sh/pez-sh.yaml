---
apiVersion: v1
kind: Namespace
metadata:
  name: pez-sh
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pez-sh
  namespace: pez-sh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pez-sh
  template:
    metadata:
      labels:
        app: pez-sh
    spec:
      nodeSelector:
        karpenter.sh/nodepool: default
      # Spread the 2 replicas across nodes so Karpenter consolidation can't take
      # the whole app down at once. ScheduleAnyway keeps it best-effort when only
      # one node is available.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pez-sh
      containers:
        - name: pez-sh
          image: rwejlgaard/pez.sh:3.0.1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pez-sh
  namespace: pez-sh
spec:
  selector:
    app: pez-sh
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pez-sh
  namespace: pez-sh
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pez-sh
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pez-sh
  namespace: pez-sh
spec:
  parentRefs:
    - name: shared-gateway
      namespace: istio-system
  hostnames:
    - "pez-sh.k8s.pez.sh"
  rules:
    - backendRefs:
        - name: pez-sh
          port: 8080
