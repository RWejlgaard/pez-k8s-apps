apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pez-sh
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RWejlgaard/pez-k8s-apps
    targetRevision: main
    path: apps/pez-sh/overlays/pez-copenhagen
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
