apiVersion: apps/v1
kind: Deployment
metadata:
  name: pez-forms
  namespace: pez-forms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pez-forms
  template:
    metadata:
      labels:
        app: pez-forms
    spec:
      serviceAccountName: pez-forms
      # The SA is a mesh identity, not an API-server credential; ztunnel gets
      # certs via istiod, the pod never needs the token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        karpenter.sh/nodepool: default
      # Hard anti-affinity so Karpenter consolidation can't drain the whole
      # app at once.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: pez-forms
      containers:
        - name: pez-forms
          image: rwejlgaard/pez-forms:v1.1.0
          envFrom:
            - configMapRef:
                name: pez-forms-config
            - secretRef:
                name: pez-forms-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
