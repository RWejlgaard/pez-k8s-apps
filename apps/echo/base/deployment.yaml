apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      serviceAccountName: echo
      # The SA is a mesh identity, not an API-server credential; ztunnel gets
      # certs via istiod, the pod never needs the token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # ealen/echo-server has no USER directive (runs as root) and binds :80,
        # so it can't run under the hardened non-root defaults.
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        karpenter.sh/nodepool: default
      # Hard anti-affinity so Karpenter consolidation can't drain the whole
      # app at once; a no-op at replicas=1.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: echo
      containers:
        - name: echo
          image: ealen/echo-server:0.9.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - NET_RAW
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
