apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RWejlgaard/pez-k8s-apps
    targetRevision: main
    path: apps/echo/overlays/pez-london
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
