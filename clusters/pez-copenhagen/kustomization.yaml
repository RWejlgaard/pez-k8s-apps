apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # App of apps: one ArgoCD Application per workload deployed to this
  # cluster, each syncing its own base+overlay manifest directory under
  # ../../apps/<name>/overlays/pez-copenhagen. Kept local to this directory (rather
  # than referenced from apps/) because ArgoCD's kustomize security setting
  # only allows loading files from outside the build root when they're a
  # directory with its own kustomization.yaml, not a loose file like
  # application.yaml.
  - echo-application.yaml
  - pez-sh-application.yaml
  - podinfo-application.yaml
